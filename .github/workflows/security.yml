# CI sans carte : exécution sur une machine GitHub temporaire, jamais sur la VM publique.
name: FleetBook - controles de securite

on:
  push:
    branches: [main, vulnerable, secure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_test:
    name: Build, tests et lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run lint && npm run typecheck
      - run: DATABASE_URL=postgresql://fake:fake@127.0.0.1:5432/fake npm run build

  sast:
    name: Semgrep ERROR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Semgrep dans un environnement isolé
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet 'semgrep==1.183.0'
      - name: Bloquer les alertes et les erreurs d'analyse
        run: |
          mkdir -p reports
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --metrics off --config .semgrep.yml --severity ERROR --error --strict --json --output reports/semgrep.json src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: reports/semgrep.json
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Gitleaks - secrets masques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Gitleaks avec vérification SHA-256
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum -c --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Bloquer les secrets du commit sans afficher leurs valeurs
        run: |
          mkdir -p reports
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -x -C "$scan_dir"
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact=100 --report-format json --report-path reports/gitleaks.json --exit-code 1 "$scan_dir"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks
          path: reports/gitleaks.json
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    name: Trivy dependances CRITICAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Trivy avec vérification SHA-256
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_checksums.txt
          sha256sum -c --ignore-missing trivy_0.76.2_checksums.txt
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz trivy
      - name: Bloquer les vulnérabilités CRITICAL
        run: |
          mkdir -p reports
          "$RUNNER_TEMP/trivy" fs --scanners vuln --skip-dirs node_modules --severity CRITICAL --exit-code 1 --format json --output reports/trivy-fs.json .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs
          path: reports/trivy-fs.json
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Image, scan CRITICAL, registre GHCR
    runs-on: ubuntu-latest
    needs: [build_test, sast, secrets, dependencies]
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image après tous les contrôles
        run: docker build --target runner --tag "${APP_IMAGE,,}" .
      - name: Installer Trivy avec vérification SHA-256
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          curl -fsSLO https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_checksums.txt
          sha256sum -c --ignore-missing trivy_0.76.2_checksums.txt
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz trivy
      - name: Bloquer les images CRITICAL
        run: |
          mkdir -p reports
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity CRITICAL --exit-code 1 --format json --output reports/trivy-image.json "${APP_IMAGE,,}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image
          path: reports/trivy-image.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Publier vers GHCR seulement apres un scan vert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${APP_IMAGE,,}"
          docker logout ghcr.io
