# Runner shell local (tag fleetbook-local) : les scanners bloquent avant le push.
stages: [build, test, sast, secrets, dependencies, image_build, image_scan, push, deploy, dast]
default:
  tags: [fleetbook-local]
variables:
  APP_IMAGE: "$CI_REGISTRY_IMAGE/fleetbook:$CI_COMMIT_SHA"
  TRIVY_NO_PROGRESS: "true"
  SEMGREP_ENABLE_VERSION_CHECK: "0"
  SEMGREP_SEND_METRICS: "off"

build:
  stage: build
  script:
    - npm ci --no-audit --no-fund
    # Identifiants fictifs utilisés uniquement pour la compilation, jamais une connexion réelle.
    - DATABASE_URL=postgresql://fake:fake@127.0.0.1:5432/fake JWT_SECRET=FAKE_BUILD_SECRET_32_CHARS_NOT_REAL npm run build

test:
  stage: test
  script:
    - npm ci --no-audit --no-fund
    - npm test
    - npm run lint
    - npm run typecheck

sast:
  stage: sast
  script:
    - mkdir -p reports
    - semgrep scan --metrics off --config .semgrep.yml --severity ERROR --error --strict --json --output reports/semgrep.json src
  artifacts:
    when: always
    paths: [reports/semgrep.json]
    expire_in: 7 days

secrets:
  stage: secrets
  when: always
  script:
    - mkdir -p reports
    - scan_dir=$(mktemp -d)
    - trap 'rm -rf "$scan_dir"' EXIT
    - git archive HEAD | tar -x -C "$scan_dir"
    - gitleaks dir --config .gitleaks.toml --redact=100 --report-format json --report-path reports/gitleaks.json --exit-code 1 "$scan_dir"
  artifacts:
    when: always
    paths: [reports/gitleaks.json]
    expire_in: 7 days

dependencies:
  stage: dependencies
  when: always
  script:
    - mkdir -p reports
    - trivy fs --scanners vuln --skip-dirs node_modules --severity CRITICAL --exit-code 1 --format json --output reports/trivy-fs.json .
  artifacts:
    when: always
    paths: [reports/trivy-fs.json]
    expire_in: 7 days

image_build:
  stage: image_build
  script:
    - docker build --target runner --tag "$APP_IMAGE" .

image_scan:
  stage: image_scan
  script:
    - mkdir -p reports
    - trivy image --scanners vuln --severity CRITICAL --exit-code 1 --format json --output reports/trivy-image.json "$APP_IMAGE"
  artifacts:
    when: always
    paths: [reports/trivy-image.json]
    expire_in: 7 days

push:
  stage: push
  script:
    - test -n "$CI_REGISTRY" && test -n "$CI_REGISTRY_PASSWORD"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$APP_IMAGE"
    - docker logout "$CI_REGISTRY"

# Réservé au futur bloc Kubernetes : les manifestes Drive n'ont pas été validés.
deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "secure" && $KUBECONFIG && $FLEETBOOK_DB_PASSWORD && $FLEETBOOK_JWT_SECRET'
      exists: [k8s/namespace.yaml]
  script:
    - kubectl apply -f k8s/namespace.yaml
    - kubectl apply -f k8s/
    - kubectl -n fleetbook rollout status deployment/fleetbook-backend --timeout=120s

# ZAP est ajouté après un déploiement local validé ; aucune URL externe codée en dur.
dast:
  stage: dast
  rules:
    - if: '$CI_COMMIT_BRANCH == "secure" && $DAST_TARGET && $KUBECONFIG'
      exists: [scripts/zap_local.sh, k8s/namespace.yaml]
  script:
    - mkdir -p reports
    - sh scripts/zap_local.sh "$DAST_TARGET" reports/zap.html
  artifacts:
    when: always
    paths: [reports/zap.html]
    expire_in: 7 days
