apiVersion: batch/v1
kind: Job
metadata:
  name: drizzle-migrate
  namespace: fleetbook
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: fleetbook-tooling:local
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fleetbook-secrets
                  key: DATABASE_URL
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: npm-cache
              mountPath: /home/node/.npm
      volumes:
        - name: npm-cache
          emptyDir: {}
