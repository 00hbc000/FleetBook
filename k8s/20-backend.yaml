# Pod Backend — API REST, authentification, 2 rôles (Admin / Utilisateur)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetbook-backend
  namespace: fleetbook
spec:
  replicas: 2
  selector:
    matchLabels: { app: fleetbook-backend }
  template:
    metadata:
      labels: { app: fleetbook-backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: registry.gitlab.com/votre-groupe/fleetbook/fleetbook-backend:latest # remplacée par CI (jamais :latest en prod — tag SHA)
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: fleetbook-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: fleetbook-secrets, key: JWT_SECRET } }
            - { name: NODE_ENV, value: "production" }
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: fleetbook-backend
  namespace: fleetbook
spec:
  selector: { app: fleetbook-backend }
  ports: [{ port: 3000, targetPort: 3000 }]
