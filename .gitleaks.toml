# Les règles standard ignorent souvent les valeurs délibérément factices.
# Règle locale pour les exercices VULN-05 ; jamais pour un vrai secret.
title = "FleetBook - secrets factices de formation"

[[rules]]
id = "fleetbook-fake-training-secrets"
description = "Secrets factices écrits en dur (VULN-05)"
regex = '''FAKE_(JWT_SECRET|API_KEY)_FOR_TRAINING'''
tags = ["training", "fake-secret"]
