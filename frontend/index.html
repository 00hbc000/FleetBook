<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FleetBook — Démonstration locale</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><h1>FleetBook</h1><p>Réservation de véhicules — données fictives</p></header>
  <main>
    <p class="warning">Application volontairement vulnérable, à utiliser uniquement en local.</p>
    <p id="message" role="status"></p>
    <section id="auth">
      <div class="columns">
        <form id="login"><h2>Connexion</h2>
          <label>Email <input name="email" type="text" required></label>
          <label>Mot de passe <input name="password" type="password" required></label>
          <button>Se connecter</button>
        </form>
        <form id="register"><h2>Inscription</h2>
          <label>Nom <input name="name" required></label>
          <label>Email <input name="email" type="email" required></label>
          <label>Mot de passe <input name="password" type="password" minlength="8" required></label>
          <label>Téléphone fictif <input name="phone" required></label>
          <label>Permis fictif <input name="licenseNumber" required></label>
          <button>Créer un compte utilisateur</button>
        </form>
      </div>
    </section>
    <section id="session" hidden><p id="welcome"></p><button id="logout" type="button">Déconnexion</button></section>
    <section><h2>Véhicules</h2>
      <form id="search"><label>Recherche <input name="search" placeholder="Nom du véhicule"></label><button>Rechercher</button></form>
      <div id="vehicles" class="list"></div>
    </section>
    <section id="user-area" hidden>
      <h2>Réserver</h2>
      <form id="booking">
        <label>Véhicule <select name="vehicleId" id="vehicle-select" required></select></label>
        <label>Début <input name="startDate" type="date" required></label>
        <label>Fin <input name="endDate" type="date" required></label>
        <button>Réserver</button>
      </form>
      <h2>Mes réservations</h2><div id="my-bookings" class="list"></div>
    </section>
    <section id="admin-area" hidden>
      <h2>Administration</h2>
      <form id="vehicle-form"><h3>Ajouter / modifier un véhicule</h3>
        <input name="id" type="hidden">
        <label>Nom <input name="name" required></label>
        <label>Immatriculation fictive <input name="plate" required></label>
        <label>Places <input name="seats" type="number" min="1" required></label>
        <label>Prix / jour <input name="dailyPrice" type="number" min="0" step="0.01" required></label>
        <button>Enregistrer</button><button id="cancel-edit" type="button">Annuler</button>
      </form>
      <h3>Toutes les réservations</h3><div id="all-bookings" class="list"></div>
      <h3>Utilisateurs</h3><div id="users" class="list"></div>
    </section>
  </main>
</body>
</html>
