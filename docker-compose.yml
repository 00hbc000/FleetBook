# Projet isolé : n'utilise ni le port ni le volume de l'ancien FleetBook.
name: fleetbook-next
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copier .env.example vers .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copier .env.example vers .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copier .env.example vers .env}
    volumes:
      - next_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: .
      target: tooling
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      JWT_SECRET: ${JWT_SECRET:?Copier .env.example vers .env}
      COOKIE_SECURE: "false" # HTTP local seulement ; activer sous HTTPS.
    ports:
      - "127.0.0.1:8081:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  next_pgdata:
